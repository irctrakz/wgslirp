name: Docker build & push to GHCR

on:
  workflow_dispatch:
    inputs:
      pooling-study:
        description: Run only the bounded pooling comparison (no image publishing)
        type: boolean
        default: false
      pooling-profile:
        description: Pooling comparison profile
        type: choice
        options: [basic, sustained]
        default: basic
  push:
    branches: [master, codex/architecture-hardening, codex/integration-05-features, codex/integration-06-closewrite, codex/master-tested-image, codex/binary-releases]
    tags: ["v*"]
  pull_request:                 # PRs = build-only

permissions:
  contents: read

jobs:
  pooling-study:
    if: github.event_name == 'workflow_dispatch' && inputs.pooling-study && (github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/pooling.yml
    with:
      profile: ${{ inputs.pooling-profile }}

  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.pooling-study
    uses: ./.github/workflows/go.yml

  encrypted-capacity:
    needs: test
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/capacity.yml

  encrypted-wan:
    needs: [test, encrypted-capacity, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/capacity.yml
    with:
      workload: wan

  encrypted-sustained:
    needs: [test, encrypted-capacity, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/capacity.yml
    with:
      workload: sustained

  encrypted-mixed:
    needs: [test, encrypted-capacity, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/capacity.yml
    with:
      workload: mixed

  encrypted-fragments:
    needs: [test, encrypted-capacity, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/capacity.yml
    with:
      workload: fragments

  encrypted-fragments-unpaced:
    needs: [test, encrypted-capacity, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    uses: ./.github/workflows/capacity.yml
    with:
      workload: fragments-unpaced
      repetitions: '[1,2,3]'

  release-image-build:
    needs: test
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    env:
      RELEASE_RUN: '${{ github.run_id }}-${{ github.run_attempt }}'
      RELEASE_IMAGE: ghcr.io/irctrakz/wgslirp
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the version tag and reviewed source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', os.environ['VERSION_TAG']), 'expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-SUFFIX'
          PY
          git fetch --no-tags origin master:refs/remotes/origin/master
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --no-tags origin
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build the release Dockerfile with a bounded builder
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > release-evidence/source-commit.txt
          git rev-parse HEAD > release-evidence/fixture-commit.txt
          docker buildx create --name "wgslirp-$RELEASE_RUN" --driver docker-container \
            --driver-opt memory=2g,memory-swap=2g,cpu-period=100000,cpu-quota=100000,restart-policy=no --use --bootstrap
          builder="buildx_buildkit_wgslirp-${RELEASE_RUN}0"
          docker update --pids-limit=128 "$builder"
          docker inspect --format '{{json .HostConfig}}' "$builder" > release-evidence/builder-limits.json
          python3 - <<'PY'
          import json
          c = json.load(open('release-evidence/builder-limits.json'))
          assert (c['Memory'], c['MemorySwap'], c['CpuPeriod'], c['CpuQuota'], c['PidsLimit']) == (2147483648, 2147483648, 100000, 100000, 128)
          PY
          timeout --signal=TERM --kill-after=15s 600s docker buildx build \
            --builder "wgslirp-$RELEASE_RUN" --push --platform linux/amd64,linux/arm64 --provenance=false \
            --metadata-file release-evidence/build.json \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$RELEASE_IMAGE:candidate-$RELEASE_RUN" --file Dockerfile .
      - name: Record the immutable multi-architecture digest
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          digest=$(python3 - <<'PY'
          import json, re
          digest = json.load(open('release-evidence/build.json'))['containerimage.digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'invalid build digest'
          print(digest)
          PY
          )
          docker buildx imagetools inspect "$RELEASE_IMAGE@$digest" \
            --format '{{json .Manifest}}' > release-evidence/index-manifest.json
          python3 - <<'PY'
          import json
          index = json.load(open('release-evidence/index-manifest.json'))
          platforms = [(m['platform']['os'], m['platform']['architecture']) for m in index['manifests']]
          assert sorted(platforms) == [('linux', 'amd64'), ('linux', 'arm64')], 'wrong release platforms'
          PY
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RELEASE_IMAGE@$digest" > release-evidence/image-reference.txt
      - name: Remove owned builder resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx inspect "wgslirp-$RELEASE_RUN" >/dev/null 2>&1; then
            docker buildx rm "wgslirp-$RELEASE_RUN"
          fi
          builders=$(docker ps -aq --filter "name=^/buildx_buildkit_wgslirp-${RELEASE_RUN}0$")
          volumes=$(docker volume ls -q --filter "name=^buildx_buildkit_wgslirp-${RELEASE_RUN}0_state$")
          test -z "$builders$volumes"
          mkdir -p release-evidence
          printf 'No owned builder or cache volume remain.\n' > release-evidence/cleanup.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: 'release-build-${{ github.run_id }}-${{ github.run_attempt }}'
          path: release-evidence/
          retention-days: 7
          if-no-files-found: error

  release-image-test:
    needs: [test, release-image-build]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_RUN: '${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}'
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_IMAGE: ghcr.io/irctrakz/wgslirp
      TESTED_DIGEST: ${{ needs.release-image-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache-dependency-path: go.sum
      - name: Pull the candidate by immutable digest
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          digest="$TESTED_DIGEST"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p release-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > release-evidence/source-commit.txt
          git rev-parse HEAD > release-evidence/fixture-commit.txt
          image="$RELEASE_IMAGE@$digest"
          printf 'WGSLIRP_RELEASE_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          docker pull --platform "linux/$RELEASE_ARCH" "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$RELEASE_ARCH"
          docker image inspect --format '{{.Id}}' "$image" > release-evidence/image-id.txt
          printf '%s\n' "$image" > release-evidence/image-reference.txt
      - name: Test non-root encrypted forwarding and SIGTERM
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WGSLIRP_RELEASE_IMAGE"
          export WGSLIRP_RELEASE_RUN="$RELEASE_RUN"
          export WGSLIRP_RELEASE_COMMIT="$(cat release-evidence/source-commit.txt)"
          export WGSLIRP_RELEASE_REPORT="$PWD/release-evidence"
          export GOMAXPROCS=1 GOMEMLIMIT=512MiB
          timeout --signal=TERM --kill-after=10s 180s go test -v -tags=integration,releaseimage \
            -run='^TestReleaseImage$' -timeout=120s -count=1 -parallel=1 ./pkg/wireguard \
            2>&1 | tee release-evidence/runtime-test.log
          python3 - <<'PY'
          import json, os
          for mode, enabled, policy in [('default', True, 'unset'), ('disabled', False, 'false')]:
              report = json.load(open(f'release-evidence/runtime-{mode}.json'))
              assert report['passed'] is True, f'{mode} runtime fixture did not pass'
              assert report['ipv4_reassembly'] is enabled, 'wrong reassembly mode'
              assert report['reassembly_environment'] == policy, 'wrong startup policy tested'
              assert report['pooling'] is enabled, 'wrong effective pooling policy'
              assert report['pooling_environment'] == policy, 'wrong pooling startup policy tested'
              assert report['icmp_echo'] is enabled, 'wrong effective echo policy'
              assert report['icmp_echo_environment'] == policy, 'wrong echo startup policy tested'
              if enabled:
                  assert report['verified_icmp_echo_rounds'] == 1, 'encrypted ping not verified'
                  assert report['icmp_echo_denied_startup_verified'] is True, 'ping-denied startup not verified'
              else:
                  assert report['icmp_echo_disabled_verified'] is True, 'disabled ping not verified'
              assert report['image'] == os.environ['WGSLIRP_RELEASE_IMAGE'], 'wrong image tested'
              assert report['source_commit'] == os.environ['GITHUB_SHA'], 'wrong source tested'
              assert report['initial']['Image'] == open('release-evidence/image-id.txt').read().strip(), 'wrong container image'
          PY
      - name: Package the tested executable
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p binary-package binary-dist
          container="wgslirp-binary-$RELEASE_RUN"
          docker create --name "$container" --label "wgslirp.release.run=$RELEASE_RUN" \
            "$WGSLIRP_RELEASE_IMAGE"
          docker cp "$container:/usr/local/bin/wgslirp" binary-package/wgslirp
          docker rm "$container"
          chmod 755 binary-package/wgslirp
          cp LICENSE binary-package/LICENSE
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct
          binary = pathlib.Path('binary-package/wgslirp').read_bytes()
          assert binary[:6] == b'\x7fELF\x02\x01', 'expected little-endian ELF64 executable'
          machine = struct.unpack_from('<H', binary, 18)[0]
          assert machine == {'amd64': 62, 'arm64': 183}[os.environ['RELEASE_ARCH']], 'wrong binary architecture'
          phoff = struct.unpack_from('<Q', binary, 32)[0]
          phsize, phcount = struct.unpack_from('<HH', binary, 54)
          assert phsize >= 56 and phoff + phsize * phcount <= len(binary), 'invalid ELF program headers'
          assert all(struct.unpack_from('<I', binary, phoff + i * phsize)[0] != 3 for i in range(phcount)), 'binary requires a dynamic interpreter'
          metadata = {'source_commit': os.environ['GITHUB_SHA'], 'image': os.environ['WGSLIRP_RELEASE_IMAGE'],
                      'platform': 'linux/' + os.environ['RELEASE_ARCH'],
                      'binary_sha256': hashlib.sha256(binary).hexdigest()}
          pathlib.Path('binary-package/SOURCE.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          archive="wgslirp-$GITHUB_SHA-linux-$RELEASE_ARCH.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -czf "binary-dist/$archive" \
            -C binary-package wgslirp LICENSE SOURCE.json
          (cd binary-dist && sha256sum "$archive" > "$archive.sha256")
      - name: Remove owned test resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          label="wgslirp.release.run=$RELEASE_RUN"
          containers=$(docker ps -aq --filter "label=$label")
          if [ -n "$containers" ]; then docker rm -f $containers; fi
          networks=$(docker network ls -q --filter "label=$label")
          if [ -n "$networks" ]; then docker network rm $networks; fi
          if [ -n "${WGSLIRP_RELEASE_IMAGE:-}" ] && docker image inspect "$WGSLIRP_RELEASE_IMAGE" >/dev/null 2>&1; then
            docker image rm "$WGSLIRP_RELEASE_IMAGE"
          fi
          containers=$(docker ps -aq --filter "label=$label")
          networks=$(docker network ls -q --filter "label=$label")
          test -z "$containers$networks"
          if [ -n "${WGSLIRP_RELEASE_IMAGE:-}" ] && docker image inspect "$WGSLIRP_RELEASE_IMAGE" >/dev/null 2>&1; then
            echo 'Owned candidate image remains locally' >&2
            exit 1
          fi
          mkdir -p release-evidence
          printf 'No owned runtime containers, networks or image remain.\n' > release-evidence/cleanup.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: 'release-image-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: release-evidence/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: 'binaries-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: binary-dist/
          retention-days: 7
          if-no-files-found: error


  promote-image:
    needs: [test, encrypted-capacity, encrypted-wan, encrypted-sustained, encrypted-mixed, encrypted-fragments, encrypted-fragments-unpaced, release-image-build, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/binary-releases' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/master-tested-image' || github.ref == 'refs/heads/codex/architecture-hardening' || github.ref == 'refs/heads/codex/integration-05-features' || github.ref == 'refs/heads/codex/integration-06-closewrite')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: image-promotion-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/irctrakz/wgslirp
      TESTED_DIGEST: ${{ needs.release-image-build.outputs.digest }}
      RELEASE_RUN: '${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this commit can be promoted
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p promotion-evidence
          python3 - <<'PY'
          import json, os, urllib.request
          eligible = True
          if os.environ['GITHUB_REF'] == 'refs/heads/master':
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/master",
                  headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                           'Accept': 'application/vnd.github+json', 'User-Agent': 'wgslirp-promotion'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  current = json.load(response)['object']['sha']
              eligible = current == os.environ['GITHUB_SHA']
              if not eligible:
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Master advanced; this superseded run will not update latest.\n')
          with open('promotion-evidence/policy.json', 'w') as evidence:
              json.dump({'source_commit': os.environ['GITHUB_SHA'],
                         'ref': os.environ['GITHUB_REF'], 'eligible': eligible}, evidence)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'eligible={str(eligible).lower()}\n')
          PY
      - name: Promote the tested manifest without rebuilding
        if: steps.policy.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TESTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag="dev-$GITHUB_SHA-$RELEASE_RUN"
          if [ "$GITHUB_REF" = refs/heads/master ]; then tag="sha-$GITHUB_SHA"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          mkdir -p promotion-evidence
          docker buildx imagetools create --prefer-index=false \
            --tag "$RELEASE_IMAGE:$tag" "$RELEASE_IMAGE@$TESTED_DIGEST"
          docker buildx imagetools inspect "$RELEASE_IMAGE:$tag" \
            --format '{{json .Manifest}}' > promotion-evidence/manifest.json
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('promotion-evidence/manifest.json'))
          assert manifest['digest'] == os.environ['TESTED_DIGEST'], 'promotion changed digest'
          PY
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "$RELEASE_IMAGE:latest" "$RELEASE_IMAGE@$TESTED_DIGEST"
            docker buildx imagetools inspect "$RELEASE_IMAGE:latest" \
              --format '{{json .Manifest}}' > promotion-evidence/latest-manifest.json
            python3 - <<'PY'
          import json, os
          manifest = json.load(open('promotion-evidence/latest-manifest.json'))
          assert manifest['digest'] == os.environ['TESTED_DIGEST'], 'latest changed digest'
          PY
          fi
          printf '%s\n' "$RELEASE_IMAGE@$TESTED_DIGEST" > promotion-evidence/image-reference.txt
          printf '%s\n' "$RELEASE_IMAGE:$tag" > promotion-evidence/tag.txt
          printf '%s\n' "$GITHUB_SHA" > promotion-evidence/source-commit.txt
          {
            echo '### Validated image (linux/amd64 and linux/arm64)'
            if [ "$GITHUB_REF" = refs/heads/master ]; then echo 'Promoted the tested digest to latest.'; fi
            printf '\nTag: `%s:%s`\n' "$RELEASE_IMAGE" "$tag"
            printf '\nTested and promoted digest: `%s@%s`\n' "$RELEASE_IMAGE" "$TESTED_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: 'promotion-${{ github.run_id }}-${{ github.run_attempt }}'
          path: promotion-evidence/
          retention-days: 7
          if-no-files-found: error

  release-binaries:
    needs: [promote-image, release-image-build, release-image-test]
    if: github.repository == 'irctrakz/wgslirp' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: binary-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION_TAG: ${{ github.ref_name }}
      TESTED_IMAGE: ghcr.io/irctrakz/wgslirp@${{ needs.release-image-build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: 'binaries-*-${{ github.run_id }}-${{ github.run_attempt }}'
          path: binary-dist
          merge-multiple: true
      - name: Verify binary archives before publication
        shell: bash
        run: |
          set -euo pipefail
          cd binary-dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          for arch in amd64 arm64; do
            archive="wgslirp-$GITHUB_SHA-linux-$arch.tar.gz"
            sha256sum --check "$archive.sha256"
          done
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          for arch in ['amd64', 'arm64']:
              archive = f"wgslirp-{os.environ['GITHUB_SHA']}-linux-{arch}.tar.gz"
              with tarfile.open(archive, 'r:gz') as package:
                  members = package.getmembers()
                  assert sorted(m.name for m in members) == ['LICENSE', 'SOURCE.json', 'wgslirp'], 'unexpected archive contents'
                  assert all(m.isfile() and m.size <= 32 * 1024 * 1024 for m in members), 'invalid archive member'
                  metadata = json.load(package.extractfile('SOURCE.json'))
                  binary = package.extractfile('wgslirp').read()
                  assert metadata['source_commit'] == os.environ['GITHUB_SHA'], 'wrong source commit'
                  assert metadata['image'] == os.environ['TESTED_IMAGE'], 'wrong tested image'
                  assert metadata['platform'] == 'linux/' + arch, 'wrong archive platform'
                  assert metadata['binary_sha256'] == hashlib.sha256(binary).hexdigest(), 'wrong binary checksum'
          PY
          cat *.sha256 > SHA256SUMS
      - name: Publish a complete versioned release
        shell: bash
        run: |
          set -euo pipefail
          tag="$VERSION_TAG"
          prerelease=false
          if [[ "$tag" == *-* ]]; then prerelease=true; fi
          printf 'Source: `%s`\n\nTested image: `%s`\n\nLinux amd64 and arm64 executables extracted from the tested release images. Verify downloads with SHA256SUMS.\n' \
            "$GITHUB_SHA" "$TESTED_IMAGE" > release-notes.txt
          if gh release view "$tag" --json isDraft > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          assert json.load(open('existing-release.json'))['isDraft'], 'version is already published; refusing to replace assets'
          PY
          else
            gh release create "$tag" --verify-tag --draft --title "$tag" \
              --notes-file release-notes.txt --prerelease="$prerelease"
          fi
          gh release upload "$tag" binary-dist/*.tar.gz binary-dist/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease="$prerelease" --latest=false
          printf '### Binary release\n\nhttps://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build pull request
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
