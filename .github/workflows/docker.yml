name: Docker build & push to GHCR

on:
  workflow_dispatch:            # manual runs allowed
  push:
    branches: [master]          # after merge to master
  pull_request:                 # PRs = build-only

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/go.yml

  docker:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build pull request
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            ghcr.io/irctrakz/wgslirp:latest
            ghcr.io/irctrakz/wgslirp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: test
    # Suspended during curated integration; stable release policy requires separate review.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/irctrakz/wgslirp:latest
            ghcr.io/irctrakz/wgslirp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
