name: Bounded encrypted workloads

on:
  workflow_call:
    inputs:
      workload:
        type: string
        default: capacity
      repetitions:
        type: string
        default: '[1]'

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        mode: [ordinary, race]
        repetition: ${{ fromJSON(inputs.repetitions) }}
    env:
      MODE: ${{ matrix.mode }}
      WORKLOAD: ${{ inputs.workload }}
      CONTAINER: wgslirp-${{ inputs.workload }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}-${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run a fresh bounded workload
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker pull golang:1.23.12-bookworm
          docker image inspect golang:1.23.12-bookworm --format '{{json .RepoDigests}}' > evidence/toolchain-image.json
          docker image inspect golang:1.23.12-bookworm --format '{{.Id}}' > evidence/toolchain-image-id.txt
          docker create --name "$CONTAINER" --user "$(id -u):$(id -g)" \
            --cpus=1 --memory=2g --memory-swap=2g --pids-limit=128 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /work:rw,exec,nosuid,nodev,size=768m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/evidence" \
            --log-driver=json-file --log-opt=max-size=4m --log-opt=max-file=2 \
            -e MODE -e WORKLOAD -e GOMAXPROCS=1 -e GOMEMLIMIT=512MiB \
            -e GOCACHE=/work/cache -e GOPATH=/work/gopath -e GOTMPDIR=/work/build \
            -e WGSLIRP_FRAGMENT_PROFILE_DIR=/evidence \
            golang:1.23.12-bookworm timeout --signal=TERM --kill-after=10s 600s bash -c '
              set -eu
              mkdir -p "$GOTMPDIR"
              cp -a /src/. /work/source
              cd /work/source
              race_flag=""
              if [ "$MODE" = race ]; then race_flag=-race; fi
              case "$WORKLOAD" in
                capacity) test_name=TestEncryptedChurnCapacity; test_timeout=420s ;;
                wan) test_name=TestEncryptedWANRecovery; test_timeout=120s ;;
                sustained) test_name=TestEncryptedSustainedLoss; test_timeout=330s ;;
                mixed) test_name=TestEncryptedMixed; test_timeout=120s ;;
                fragments) test_name=TestEncryptedFragments; test_timeout=300s ;;
                fragments-unpaced) test_name=TestEncryptedFragmentsUnpaced; test_timeout=300s ;;
                *) echo "Unknown workload" >&2; exit 1 ;;
              esac
              set +e
              test_tags="integration,$WORKLOAD"
              case "$WORKLOAD" in
                fragments|fragments-unpaced) test_tags="integration,fragments,mixed" ;;
              esac
              if [ "$WORKLOAD" = fragments ]; then
                go test $race_flag -run="^$" -bench="^BenchmarkIPv4Fragments$" -benchmem \
                  -benchtime=100ms -count=3 -timeout=60s -parallel=1 ./pkg/socket > /evidence/reassembly-allocations.txt
                benchmark_result=$?
                cat /evidence/reassembly-allocations.txt
                if [ "$benchmark_result" != 0 ]; then exit "$benchmark_result"; fi
              fi
              go test $race_flag -v -tags="$test_tags" -run="^${test_name}$" -timeout="$test_timeout" -count=1 -parallel=1 ./pkg/wireguard
              result=$?
              set -e
              if [ -f /evidence/fragment-breach.pprof ]; then
                go tool pprof -top -sample_index=inuse_space /evidence/fragment-breach.pprof > /evidence/fragment-inuse.txt
                go tool pprof -top -sample_index=alloc_space /evidence/fragment-breach.pprof > /evidence/fragment-allocations.txt
                cat /evidence/fragment-inuse.txt /evidence/fragment-allocations.txt
              fi
              echo CGROUP_MEMORY_PEAK
              cat /sys/fs/cgroup/memory.peak
              cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/pids.events
              if grep -Eq "^(max|oom|oom_kill|oom_group_kill) [1-9]" /sys/fs/cgroup/memory.events /sys/fs/cgroup/pids.events; then exit 1; fi
              exit "$result"
            '
          docker inspect "$CONTAINER" --format '{{json .HostConfig}}' > evidence/limits.json
          python3 - <<'PY'
          import json
          c = json.load(open('evidence/limits.json'))
          assert c['Memory'] == c['MemorySwap'] == 2147483648
          assert c['NanoCpus'] == 1000000000 and c['PidsLimit'] == 128
          assert c['ReadonlyRootfs'] and c['CapDrop'] == ['ALL']
          assert 'no-new-privileges' in c['SecurityOpt']
          PY
          timeout --signal=TERM --kill-after=15s 620s docker start --attach "$CONTAINER" 2>&1 | tee evidence/test.log
          test "$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER")" = 0
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$CONTAINER")" = false
          case "$WORKLOAD" in
            capacity) grep -q 'CAPACITY_ACCEPTED' evidence/test.log ;;
            wan) grep -q 'WAN_ACCEPTED' evidence/test.log ;;
            sustained) grep -q 'SUSTAINED_ACCEPTED' evidence/test.log ;;
            mixed) grep -q 'MIXED_ACCEPTED' evidence/test.log ;;
            fragments) grep -q 'FRAGMENTS_ACCEPTED' evidence/test.log ;;
            fragments-unpaced) grep -q 'FRAGMENTS_UNPACED_ACCEPTED' evidence/test.log ;;
            *) exit 1 ;;
          esac
      - name: Remove owned container and toolchain image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            docker logs "$CONTAINER" > evidence/container.log 2>&1
            docker inspect "$CONTAINER" --format '{{json .State}}' > evidence/final-state.json
            docker rm -f "$CONTAINER"
          fi
          test -z "$(docker ps -aq --filter "name=^/$CONTAINER$")"
          if docker image inspect golang:1.23.12-bookworm >/dev/null 2>&1; then
            image_id=$(docker image inspect golang:1.23.12-bookworm --format '{{.Id}}')
            docker image rm golang:1.23.12-bookworm
            if docker image inspect "$image_id" >/dev/null 2>&1; then
              echo 'Toolchain image remains after removal' >&2
              exit 1
            fi
          fi
          echo 'Owned container, tmpfs and toolchain image removed; no owned network or persistent volume created.' > evidence/cleanup.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ inputs.workload }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.repetition }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
