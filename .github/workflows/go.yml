name: Go Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - name: Install dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          cp deploy/compose.yaml "$validation_dir/compose.yaml"
          printf 'WG_PRIVATE_KEY=validation-only\n' > "$validation_dir/wgslirp.env"
          if env -u WGSLIRP_IMAGE docker compose -f "$validation_dir/compose.yaml" config --quiet >/dev/null 2>&1; then
            echo 'Deployment accepted a missing image selection' >&2
            exit 1
          fi
          export WGSLIRP_IMAGE="ghcr.io/irctrakz/wgslirp@sha256:$(printf '%064d' 0)"
          docker compose -f "$validation_dir/compose.yaml" config --quiet

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Run tests
        run: go test -race -timeout 120s -count=1 ./...

      - name: Run integration tests
        run: go test -race -tags=integration -timeout 120s -count=1 ./...

      - name: Fuzz packet boundaries
        run: go test -run '^$' -fuzz '^FuzzTransportBoundaries$' -fuzztime 10s -timeout 120s -parallel 2 ./pkg/socket

      - name: Fuzz shared encoding
        run: go test -run '^$' -fuzz '^FuzzEncoding$' -fuzztime 10s -timeout 120s -parallel 2 ./internal/packetwire
