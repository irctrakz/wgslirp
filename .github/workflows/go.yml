name: Go Tests

on:
  push:
    branches: [master, codex/architecture-hardening, "codex/integration-*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      standalone-release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GO_CHECK_PACKAGES: ${{ inputs.standalone-release && './cmd/wgslirp ./cmd/stress_wg_queue ./internal/application ./internal/envconfig ./internal/packetwire ./pkg/...' || './...' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Check module tidiness
        if: '!inputs.standalone-release'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          cp deploy/compose.yaml "$validation_dir/compose.yaml"
          printf 'WG_PRIVATE_KEY=validation-only\n' > "$validation_dir/wgslirp.env"
          if env -u WGSLIRP_IMAGE docker compose -f "$validation_dir/compose.yaml" config --quiet >/dev/null 2>&1; then
            echo 'Deployment accepted a missing image selection' >&2
            exit 1
          fi
          export WGSLIRP_IMAGE="ghcr.io/irctrakz/wgslirp@sha256:$(printf '%064d' 0)"
          docker compose -f "$validation_dir/compose.yaml" config --quiet

      - name: Validate binary release failure controls
        if: '!inputs.standalone-release'
        run: python3 tools/ci/test_binary_release.py -v

      - name: Validate standalone release failure controls
        if: inputs.standalone-release
        run: python3 tools/ci/test_binary_release.py -v BinaryPackageTests ReleasePublicationTests

      - name: Cross-build the helper for Windows and macOS
        if: '!inputs.standalone-release'
        shell: bash
        run: |
          set -euo pipefail
          for os in windows darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$RUNNER_TEMP/helper-$os-$arch" ./cmd/wgslirp-helper
            done
          done

      - name: Build and vet
        shell: bash
        run: |
          read -r -a packages <<< "$GO_CHECK_PACKAGES"
          go build "${packages[@]}"
          go vet "${packages[@]}"

      - name: Run tests
        shell: bash
        run: |
          read -r -a packages <<< "$GO_CHECK_PACKAGES"
          go test -race -timeout 120s -count=1 "${packages[@]}"

      - name: Run integration tests
        shell: bash
        run: |
          read -r -a packages <<< "$GO_CHECK_PACKAGES"
          go build -o "$RUNNER_TEMP/wgslirp-test" ./cmd/wgslirp
          WGSLIRP_RELEASE_BINARY="$RUNNER_TEMP/wgslirp-test" go test -race -tags=integration -timeout 120s -count=1 "${packages[@]}"

      - name: Fuzz packet boundaries
        run: go test -run '^$' -fuzz '^FuzzTransportBoundaries$' -fuzztime 10s -timeout 120s -parallel 2 ./pkg/socket

      - name: Fuzz shared encoding
        run: go test -run '^$' -fuzz '^FuzzEncoding$' -fuzztime 10s -timeout 120s -parallel 2 ./internal/packetwire

      - name: Fuzz IPv4 reassembly
        run: go test -run '^$' -fuzz '^FuzzIPv4FragmentReassembly$' -fuzztime 10s -timeout 120s -parallel 2 ./pkg/socket
