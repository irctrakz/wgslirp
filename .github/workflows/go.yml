name: Go Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - name: Install dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Run tests
        run: go test -race -timeout 120s -count=1 ./...

      - name: Run integration tests
        run: go test -race -tags=integration -timeout 120s -count=1 ./...

      - name: Fuzz packet boundaries
        run: go test -run '^$' -fuzz '^FuzzTransportBoundaries$' -fuzztime 10s -timeout 120s -parallel 2 ./pkg/socket

      - name: Fuzz shared encoding
        run: go test -run '^$' -fuzz '^FuzzEncoding$' -fuzztime 10s -timeout 120s -parallel 2 ./internal/packetwire
